[workspace]
resolver = "3"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["Colibri Companion contributors"]
description = "An unofficial, friendly desktop companion for the colibri local inference engine"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
