[workspace]
resolver = "3"
members = ["crates/core", "crates/app", "crates/streamer", "crates/scholar", "crates/engine", "crates/engine-cli", "crates/engine-gpu"]

[workspace.package]
version = "0.1.0-alpha.15"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["Colibri Companion contributors"]
description = "An unofficial, friendly desktop companion for the colibri local inference engine"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true

# Third-party code is optimised for size; the crates on the per-frame path (layout, tessellation,
# glyph rasterisation, markdown) stay at full speed so the interface does not get slower.
[profile.release.package."*"]
opt-level = "s"

[profile.release.package.egui]
opt-level = 3

[profile.release.package.epaint]
opt-level = 3

[profile.release.package.emath]
opt-level = 3

[profile.release.package.ecolor]
opt-level = 3

[profile.release.package.egui_glow]
opt-level = 3

[profile.release.package.egui_extras]
opt-level = 3

[profile.release.package.egui_commonmark]
opt-level = 3

[profile.release.package.egui_commonmark_backend]
opt-level = 3

[profile.release.package.pulldown-cmark]
opt-level = 3

[profile.release.package.skrifa]
opt-level = 3

[profile.release.package.read-fonts]
opt-level = 3

[profile.release.package.font-types]
opt-level = 3
