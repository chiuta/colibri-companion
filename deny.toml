# Licence policy: only permissive licences are accepted, so the project can be
# distributed under Apache-2.0 (same as colibri) without copyleft obligations.
[graph]
all-features = false

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "Unicode-3.0", "Unlicense", "0BSD", "BSL-1.0", "CC0-1.0",
  "OFL-1.1", "Ubuntu-font-1.0", "MPL-2.0", "LicenseRef-UFL-1.0",
]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
