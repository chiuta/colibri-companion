# Licence policy: only permissive licences are accepted, so the project can be
# distributed under Apache-2.0 (same as colibri) without copyleft obligations.
[graph]
all-features = false

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "Unicode-3.0", "Unlicense", "0BSD", "BSL-1.0", "CC0-1.0",
  "OFL-1.1", "Ubuntu-font-1.0", "MPL-2.0", "LicenseRef-UFL-1.0",
]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# Known advisories, all in the Linux screen-reader stack (eframe -> accesskit_unix -> zbus), which
# reads XML only from the local D-Bus session and is pinned there to quick-xml 0.38 until
# accesskit moves on. The program does not use quick-xml itself: Office files are unpacked by a
# short Python script, never by this crate. Review again at every accesskit update.
[advisories]
ignore = [
  { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.38 only parses local D-Bus introspection XML (screen reader)" },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.38 only parses local D-Bus introspection XML (screen reader)" },
  { id = "RUSTSEC-2026-0370", reason = "zbus stack is unmaintained; used only by the Linux screen-reader bridge" },
  { id = "RUSTSEC-2026-0371", reason = "zbus stack is unmaintained; used only by the Linux screen-reader bridge" },
  { id = "RUSTSEC-2026-0372", reason = "zbus stack is unmaintained; used only by the Linux screen-reader bridge" },
]
