[package]
name = "companion-engine-gpu"
version.workspace = true
edition.workspace = true
rust-version = "1.89"
license.workspace = true
description = "GPU backend for the universal inference engine: WGSL kernels, their CPU emulation and a wgpu runner (behind the `wgpu` feature)"

[features]
default = []
# The device runner. Off by default: the kernels, layouts and their maths are testable without it.
wgpu = ["dep:wgpu", "dep:pollster"]

[dependencies]
companion-engine = { path = "../engine" }
wgpu = { version = "30", optional = true, default-features = false, features = ["wgsl", "vulkan", "metal", "dx12"] }
pollster = { version = "0.4", optional = true }

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }

[[example]]
name = "gpu_info"
