[package]
name = "colibri-rs-cli"
version.workspace = true
edition.workspace = true
rust-version = "1.89"
license.workspace = true
description = "corbul: command-line front end for the companion engine — inspect, download, chat and an OpenAI/Ollama-compatible local server"

[lib]
name = "corbul"
path = "src/lib.rs"

[[bin]]
name = "corbul"
path = "src/main.rs"

[dependencies]
companion-engine = { path = "../engine" }
companion-engine-gpu = { path = "../engine-gpu", optional = true }
serde_json = { workspace = true, features = ["preserve_order"] }

[features]
# `doctor` and `capabilities` also print the GPU capability report (the CPU does all the inference either way)
gpu = ["dep:companion-engine-gpu"]
# the device runner itself (wgpu: Vulkan / Metal / DX12); Gemma 4 then puts its big matrices on the GPU
wgpu = ["gpu", "companion-engine-gpu/wgpu"]
