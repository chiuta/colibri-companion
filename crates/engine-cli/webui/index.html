<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src http: https:; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>corbul</title>
<style>
:root{
  --hh:3.5rem;
  --bg:#ffffff;--bg2:#f3f5f8;--bg3:#e6eaf0;--fg:#1b1f24;--muted:#444d59;--line:#8a94a3;--line2:#c9d0da;
  --accent:#0b57d0;--accent-fg:#ffffff;--focus:#0b57d0;
  --ok:#0a6b2e;--okbg:#e7f5ec;--warn:#7a4200;--warnbg:#fff3e0;--bad:#a31515;--badbg:#fdeaea;
  --user:#e8effc;--code:#f1f3f6;
}
:root[data-theme=dark]{
  --bg:#12151a;--bg2:#1a1f26;--bg3:#262d37;--fg:#e8ebf0;--muted:#b4bdca;--line:#8590a0;--line2:#3a4350;
  --accent:#8ab4f8;--accent-fg:#0b0f14;--focus:#8ab4f8;
  --ok:#7ddc9a;--okbg:#14301f;--warn:#f2b35e;--warnbg:#33260f;--bad:#ff9a9a;--badbg:#3a1818;
  --user:#1d2a44;--code:#0e1116;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]):not([data-theme=dark]){
    --bg:#12151a;--bg2:#1a1f26;--bg3:#262d37;--fg:#e8ebf0;--muted:#b4bdca;--line:#8590a0;--line2:#3a4350;
    --accent:#8ab4f8;--accent-fg:#0b0f14;--focus:#8ab4f8;
    --ok:#7ddc9a;--okbg:#14301f;--warn:#f2b35e;--warnbg:#33260f;--bad:#ff9a9a;--badbg:#3a1818;
    --user:#1d2a44;--code:#0e1116;
  }
}
@media (prefers-contrast:more){
  :root{--line:#000;--line2:#333;--muted:#000;--fg:#000}
  :root[data-theme=dark]{--line:#fff;--line2:#ddd;--muted:#fff;--fg:#fff}
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:1rem/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;overflow:hidden}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:.5rem;top:-4rem;background:var(--accent);color:var(--accent-fg);padding:.5rem .75rem;z-index:20;border-radius:.4rem}
.skip:focus{top:.5rem}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--bg2);border:1px solid var(--line);border-radius:.5rem;padding:.35rem .7rem;min-height:2.25rem}
button:hover{background:var(--bg3)}
button[disabled]{opacity:.55;cursor:not-allowed}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
button.primary:hover{filter:brightness(1.08)}
button.link{background:none;border:0;text-decoration:underline;padding:.1rem .3rem;min-height:0}
input[type=text],input[type=number],input[type=password],input[type=url],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:.45rem;padding:.35rem .5rem;width:100%;min-height:2.25rem}
textarea{resize:vertical}
input[type=checkbox],input[type=radio]{width:1.15rem;height:1.15rem;accent-color:var(--accent)}
label{display:block;font-weight:600;margin:.55rem 0 .15rem}
label.inline{display:inline-flex;align-items:center;gap:.4rem;font-weight:400;margin:.2rem 0}
.hint{color:var(--muted);font-size:.875rem;margin:.2rem 0}
header.top{height:var(--hh);display:flex;align-items:center;gap:.6rem;padding:0 .75rem;border-bottom:1px solid var(--line2);background:var(--bg2)}
header.top h1{font-size:1.15rem;margin:0}
header.top .spacer{flex:1}
header.top select{width:auto}
header.top label{margin:0;display:flex;align-items:center;gap:.3rem;font-weight:400;font-size:.9rem}
.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:0 .55rem;font-size:.8rem;color:var(--muted);max-width:14rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{display:inline-block;width:.7rem;height:.7rem;border-radius:50%;border:2px solid var(--line);margin-right:.35rem;vertical-align:middle}
.dot.on{background:var(--ok);border-color:var(--ok)}
.dot.off{background:transparent;border-color:var(--bad)}
.layout{display:grid;grid-template-columns:16rem minmax(0,1fr) 23rem;height:calc(100% - var(--hh))}
#side,#aside{overflow:auto;padding:.75rem;background:var(--bg2)}
#side{border-right:1px solid var(--line2)}
#aside{border-left:1px solid var(--line2)}
#side h2,#aside summary{font-size:1rem}
#convlist{list-style:none;margin:.5rem 0;padding:0}
#convlist li{display:flex;gap:.25rem;margin:.2rem 0}
#convlist li button.pick{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#convlist li[data-current=true] button.pick{border-color:var(--accent);border-width:2px;font-weight:600}
.row{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.col2{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
details{border:1px solid var(--line2);border-radius:.6rem;margin:.5rem 0;padding:.25rem .6rem;background:var(--bg)}
details>summary{cursor:pointer;font-weight:700;padding:.35rem 0;min-height:2.25rem}
main#chat{display:flex;flex-direction:column;min-width:0;min-height:0}
.chathead{display:flex;gap:.5rem;align-items:center;padding:.5rem .9rem;border-bottom:1px solid var(--line2)}
.chathead h2{margin:0;font-size:1rem;flex:0 0 auto}
.chathead input{flex:1}
#banner{margin:.5rem .9rem 0;padding:.5rem .75rem;border:2px solid var(--warn);background:var(--warnbg);border-radius:.5rem;display:flex;gap:.5rem;align-items:flex-start}
#banner[hidden]{display:none}
#banner.err{border-color:var(--bad);background:var(--badbg)}
#banner span{flex:1;white-space:pre-wrap}
#log{flex:1;overflow:auto;padding:.75rem .9rem;scroll-padding-bottom:1rem}
.empty{color:var(--muted);text-align:center;margin-top:3rem}
article.msg{border:1px solid var(--line2);border-radius:.8rem;padding:.55rem .8rem;margin:.6rem 0;max-width:60rem}
article.msg.role-user{background:var(--user);margin-left:auto;border-color:var(--line)}
article.msg.role-assistant{background:var(--bg2)}
article.msg h3{margin:0 0 .2rem;font-size:.85rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.mc{overflow-wrap:anywhere}
.mc p{margin:.4rem 0}
.mc h4,.mc h5,.mc h6{margin:.7rem 0 .3rem}
.mc ul,.mc ol{margin:.4rem 0;padding-left:1.5rem}
.mc blockquote{margin:.5rem 0;padding:.1rem .8rem;border-left:4px solid var(--line)}
.mc code{background:var(--code);border-radius:.3rem;padding:.05rem .3rem;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.9em}
.mc hr{border:0;border-top:1px solid var(--line2);margin:.8rem 0}
.mc a{color:var(--accent)}
.user-text{white-space:pre-wrap;overflow-wrap:anywhere}
.codewrap{margin:.5rem 0;border:1px solid var(--line2);border-radius:.5rem;overflow:hidden;background:var(--code)}
.codewrap .bar{display:flex;justify-content:space-between;align-items:center;padding:.1rem .4rem;background:var(--bg3);font-size:.8rem}
.codewrap pre{margin:0;padding:.6rem;overflow:auto}
.codewrap pre code{background:none;padding:0}
.cite{display:inline;border:2px solid var(--line);border-radius:.35rem;padding:0 .25rem;background:var(--bg);box-decoration-break:clone;-webkit-box-decoration-break:clone}
.cite small{font-size:.72em;margin-right:.25rem;color:var(--muted);font-weight:700}
.cite.st-verbatim{border-color:var(--ok);background:var(--okbg)}
.cite.st-verbatim::before{content:"\2713\00a0";color:var(--ok);font-weight:700}
.cite.st-wrong_source,.cite.st-truncated,.cite.st-merged{border-color:var(--warn);background:var(--warnbg);border-style:dashed}
.cite.st-wrong_source::before,.cite.st-truncated::before,.cite.st-merged::before{content:"\007e\00a0";color:var(--warn);font-weight:700}
.cite.st-altered,.cite.st-unsupported{border-color:var(--bad);background:var(--badbg);border-style:dotted}
.cite.st-altered::before,.cite.st-unsupported::before{content:"\2717\00a0";color:var(--bad);font-weight:700}
.cite.st-unchecked{border-style:dashed}
.cite.open::after{content:"\2026";color:var(--muted)}
.acts{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.4rem}
.acts button{font-size:.85rem;min-height:2rem;padding:.15rem .55rem}
.stats{color:var(--muted);font-size:.82rem;margin:.3rem 0 0}
.qcheck{margin-top:.4rem;font-size:.9rem;border-style:solid;border-color:var(--line2)}
.qcheck ul{margin:.3rem 0;padding-left:1.2rem}
.err-text{color:var(--bad);font-weight:600;white-space:pre-wrap}
.typing::after{content:"\258d";color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.typing::after{animation:blink 1s steps(2) infinite}}
@keyframes blink{50%{opacity:0}}
#composer{border-top:1px solid var(--line2);padding:.6rem .9rem;background:var(--bg2)}
#composer .box{display:flex;gap:.5rem;align-items:flex-end}
#composer textarea{flex:1;min-height:3rem;max-height:40vh}
.srcitem{border:1px solid var(--line2);border-radius:.5rem;padding:.4rem;margin:.4rem 0;list-style:none}
ul.plain{list-style:none;padding:0;margin:.3rem 0}
.mlist li{border:1px solid var(--line2);border-radius:.5rem;padding:.4rem;margin:.3rem 0}
.mlist .pill{font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:0 .45rem;margin-left:.3rem}
.mlist .pill.on{border-color:var(--ok);color:var(--ok)}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:.15rem .7rem;margin:.3rem 0;font-size:.9rem}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0;overflow-wrap:anywhere}
pre.metrics{max-height:14rem;overflow:auto;background:var(--code);padding:.5rem;border-radius:.4rem;font-size:.78rem}
.nav-btn,#btn-panels{display:none}
@media (max-width:1100px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .nav-btn,#btn-panels{display:inline-flex}
  #side,#aside{display:none;position:fixed;top:var(--hh);bottom:0;width:min(23rem,94vw);z-index:10;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
  #side{left:0}
  #aside{right:0;left:auto}
  #side.open,#aside.open{display:block}
}
@media (max-width:560px){header.top .opt{display:none}.badge{max-width:7rem}}
@media (forced-colors:active){
  .cite,button,details,article.msg{border:2px solid CanvasText}
  :focus-visible{outline:3px solid Highlight}
  .cite.st-verbatim{border-style:solid}.cite.st-altered,.cite.st-unsupported{border-style:dotted}
}
@media print{header.top,#side,#aside,#composer,.acts{display:none}.layout{display:block;height:auto}body{overflow:visible}#log{overflow:visible}}
</style>
</head>
<body>
<a class="skip" href="#chat" data-i18n="skip">Skip to chat</a>
<header class="top">
  <button type="button" id="btn-nav" class="nav-btn" aria-expanded="false" aria-controls="side"><span aria-hidden="true">&#9776;</span><span class="sr" data-i18n="chatsNav">Conversation list</span></button>
  <h1>corbul</h1>
  <span id="modelBadge" class="badge" hidden></span>
  <span class="spacer"></span>
  <span id="statusText" role="status"><span id="statusDot" class="dot off" aria-hidden="true"></span><span id="statusLabel"></span></span>
  <label class="opt"><span data-i18n="lang">Language</span>
    <select id="langSel"></select></label>
  <label class="opt"><span data-i18n="theme">Theme</span>
    <select id="themeSel">
      <option value="auto" data-i18n="tAuto">Automatic</option>
      <option value="light" data-i18n="tLight">Light</option>
      <option value="dark" data-i18n="tDark">Dark</option>
    </select></label>
  <button type="button" id="btn-panels" aria-expanded="false" aria-controls="aside"><span aria-hidden="true">&#9881;</span> <span data-i18n="panels">Settings and sources</span></button>
</header>
<div class="layout">
  <nav id="side" aria-labelledby="chatsH">
    <h2 id="chatsH" data-i18n="chats">Conversations</h2>
    <button type="button" id="btn-new" class="primary" data-i18n="newChat">New chat</button>
    <ul id="convlist"></ul>
    <div class="row">
      <button type="button" id="btn-exp-json" data-i18n="exportJson">Export JSON</button>
      <button type="button" id="btn-exp-md" data-i18n="exportMd">Export Markdown</button>
      <button type="button" id="btn-imp" data-i18n="importFile">Import JSON</button>
    </div>
    <input type="file" id="impfile" accept="application/json,.json" class="sr" tabindex="-1" aria-hidden="true">
  </nav>
  <main id="chat" tabindex="-1">
    <div class="chathead">
      <h2 id="titleH"><label for="titleIn" class="sr" data-i18n="rename">Title</label></h2>
      <input type="text" id="titleIn" maxlength="200" autocomplete="off">
    </div>
    <div id="banner" hidden><span id="bannerText"></span><button type="button" id="bannerX" class="link" data-i18n="close">Close</button></div>
    <div id="log" role="log" aria-live="off" aria-labelledby="titleH"></div>
    <form id="composer" autocomplete="off">
      <label for="prompt" class="sr" data-i18n="msgLabel">Message</label>
      <div class="box">
        <textarea id="prompt" rows="2" data-i18n-ph="ph" maxlength="200000"></textarea>
        <button type="submit" class="primary" id="btn-send" data-i18n="send">Send</button>
        <button type="button" id="btn-stop" hidden data-i18n="stop">Stop</button>
      </div>
    </form>
    <div id="live" class="sr" role="status" aria-live="polite"></div>
  </main>
  <aside id="aside" aria-labelledby="asideH">
    <h2 id="asideH" class="sr" data-i18n="panels">Settings and sources</h2>

    <details id="d-server" open>
      <summary data-i18n="server">Server</summary>
      <label for="baseUrl" data-i18n="baseUrl">Server address</label>
      <input type="url" id="baseUrl" inputmode="url" autocomplete="off" spellcheck="false">
      <label for="tokenIn" data-i18n="token">Access token</label>
      <input type="password" id="tokenIn" autocomplete="off" spellcheck="false">
      <p class="hint" data-i18n="tokenHelp"></p>
      <div class="row"><button type="button" id="btn-connect" class="primary" data-i18n="connect">Connect</button></div>
      <p class="hint" id="corsHint" hidden data-i18n="corsHint"></p>
    </details>

    <details id="d-models" open>
      <summary data-i18n="models">Models</summary>
      <div class="row"><button type="button" id="btn-models" data-i18n="refresh">Refresh</button></div>
      <ul id="mlist" class="plain mlist"></ul>
    </details>

    <details id="d-settings" open>
      <summary data-i18n="settings">Generation settings</summary>
      <div class="col2">
        <div><label for="s-temperature" data-i18n="temp">Temperature</label><input type="number" id="s-temperature" min="0" max="5" step="0.05"></div>
        <div><label for="s-top_p">Top-p</label><input type="number" id="s-top_p" min="0" max="1" step="0.01"></div>
        <div><label for="s-top_k">Top-k</label><input type="number" id="s-top_k" min="0" max="1000" step="1"></div>
        <div><label for="s-min_p">Min-p</label><input type="number" id="s-min_p" min="0" max="1" step="0.01" aria-describedby="minpHint"></div>
        <div><label for="s-repeat" data-i18n="rep">Repeat penalty</label><input type="number" id="s-repeat" min="0.5" max="2" step="0.01"></div>
        <div><label for="s-max_tokens" data-i18n="maxTok">Max tokens</label><input type="number" id="s-max_tokens" min="1" max="1000000" step="1"></div>
      </div>
      <p class="hint" id="minpHint" data-i18n="minPNote"></p>
      <label for="s-seed" data-i18n="seed">Seed</label>
      <input type="number" id="s-seed" min="0" step="1">
      <label for="s-structured" data-i18n="structured">Structured output</label>
      <select id="s-structured">
        <option value="off" data-i18n="st_off">Free text</option>
        <option value="json" data-i18n="st_json">JSON object</option>
        <option value="schema" data-i18n="st_schema">JSON schema</option>
        <option value="regex" data-i18n="st_regex">Regular expression</option>
        <option value="grammar" data-i18n="st_grammar">GBNF grammar</option>
      </select>
      <label for="s-structValue" data-i18n="stValue">Schema / expression / grammar</label>
      <textarea id="s-structValue" rows="4" spellcheck="false"></textarea>
    </details>

    <details id="d-system">
      <summary data-i18n="sysPrompt">System prompt</summary>
      <label for="sysIn" class="sr" data-i18n="sysPrompt">System prompt</label>
      <textarea id="sysIn" rows="5"></textarea>
    </details>

    <details id="d-sources" open>
      <summary data-i18n="sources">Sources (quote lock)</summary>
      <p class="hint" data-i18n="srcHelp"></p>
      <label class="inline"><input type="checkbox" id="lockCb"> <span data-i18n="lock">Lock quotes while generating</span></label>
      <div class="row">
        <button type="button" id="btn-addsrc" data-i18n="addSrc">Add source</button>
        <button type="button" id="btn-srcfile" data-i18n="fromFile">From text file…</button>
        <input type="file" id="srcfile" accept="text/*,.txt,.md,.json,.csv,.html,.xml" multiple class="sr" tabindex="-1" aria-hidden="true">
      </div>
      <ul id="srclist" class="plain"></ul>
    </details>

    <details id="d-info">
      <summary data-i18n="info">Server info</summary>
      <div id="infoBox"></div>
    </details>

    <details id="d-caps" hidden>
      <summary data-i18n="caps">Capabilities and hardware</summary>
      <div id="capsBox"></div>
    </details>

    <details id="d-metrics" hidden>
      <summary data-i18n="metricsT">Metrics</summary>
      <pre id="metricsBox" class="metrics" tabindex="0"></pre>
    </details>
  </aside>
</div>

<script>

  const row = T[key];

const RE_CITE = /\[S(\d{1,3})\]\s*«/y;

function parseInline(s, d) {
  d = d || 0;
  const out = [];
  let buf = '';
  let i = 0;
  const n = s.length;
  const flush = () => { if (buf) { out.push({ t: 'text', v: buf }); buf = ''; } };
  const isAl = (ch) => !!ch && /[\p{L}\p{N}]/u.test(ch);
  while (i < n) {
    const c = s[i];
    if (c === '\\' && i + 1 < n && '\\`*_[]()«»#>-'.indexOf(s[i + 1]) >= 0) { buf += s[i + 1]; i += 2; continue; }
    if (c === '\n') { flush(); out.push({ t: 'br' }); i++; continue; }
    if (c === '`') {
      const j = s.indexOf('`', i + 1);
      if (j > i + 1) { flush(); out.push({ t: 'code', v: s.slice(i + 1, j) }); i = j + 1; continue; }
    }
    if (c === '«' || c === '[') {
      let tag = null, start = -1;
      if (c === '«') { start = i + 1; }
      else {
        RE_CITE.lastIndex = i;
        const m = RE_CITE.exec(s);
        if (m) { tag = parseInt(m[1], 10); start = i + m[0].length; }
      }
      if (start >= 0) {
        const j = s.indexOf('»', start);
        flush();

        if (href) { flush(); out.push({ t: 'a', href, c: parseInline(m2[1], d + 1) }); i += m2[0].length; continue; }

      if (s.startsWith(c + c, i)) {
        const j = s.indexOf(c + c, i + 2);
        if (j > i + 2 && (c === '*' || (!isAl(s[i - 1]) && !isAl(s[j + 2])))) {
          flush(); out.push({ t: 'b', c: parseInline(s.slice(i + 2, j), d + 1) }); i = j + 2; continue;
        }

        let j = i + 1;

          j = s.indexOf(c, j);

    const head = h('p', { class: 'hint', text: t('quoteCheck') + ': ' + (sum.total ? (sum.allVerbatim ? t('allVerbatim') : t('someNot')) : t('noQuotes')) });
    wrap.append(head);
    if (sum.total) {
      const ul = h('ul');
      for (const q of rep.quotes) {
        const st = typeof q.status === 'string' ? q.status : 'unsupported';
        const src = Number.isFinite(q.source) ? ' [S' + q.source + ']' : (Number.isFinite(q.found_in) ? ' → [S' + q.found_in + ']' : '');
        ul.append(h('li', { text: (q.tag != null ? '[S' + q.tag + '] ' : '') + '«' + String(q.text || '').slice(0, 300) + '» — ' + t('q_' + st) + src }));
      }
      wrap.append(ul);
    }
    return wrap;
  }
  function renderMessageContent(el, m) {
    if (m.role === 'user') { el.className = 'mc user-text'; el.textContent = m.content; return; }
    el.className = 'mc';
    renderMarkdownInto(el, m.content, m.citations);
    if (m.pending) el.classList.add('typing');
  }
  function messageNode(c, m, idx, isLast) {
    const art = h('article', { class: 'msg role-' + m.role, 'data-i': idx, 'aria-busy': m.pending ? 'true' : null });
    art.append(h('h3', { text: m.role === 'user' ? t('you') : t('assistant') + (m.model ? ' · ' + m.model : '') }));
    const body = h('div');
    renderMessageContent(body, m);
    art.append(body);
    if (m.error) art.append(h('p', { class: 'err-text', role: 'alert', text: t('err') + ': ' + m.error }));
    const sl = statsLine(m);
    if (sl) art.append(h('p', { class: 'stats', text: sl }));
    if (m.citations) art.append(quoteCheckNode(m));
    if (!m.pending) {
      const acts = h('div', { class: 'acts' });
      acts.append(copyButton(() => m.content));
      if (m.role === 'assistant' && m.srcIds && m.srcIds.length && m.content) {
        const vb = h('button', { type: 'button', text: state.verifying.has(m) ? t('verifying') : t('verify'), disabled: state.verifying.has(m) });
        vb.addEventListener('click', () => verifyMessage(c, m));
        acts.append(vb);
      }
      if (m.role === 'assistant' && isLast && !state.busy) {
        const rb = h('button', { type: 'button', text: t('regen') });
        rb.addEventListener('click', () => regenerate());
        acts.append(rb);
      }
      const db = h('button', { type: 'button', text: t('delMsg') });
      db.addEventListener('click', () => { c.messages.splice(idx, 1); c.updated = Date.now(); save(); renderLog(); });
      acts.append(db);
      art.append(acts);
    }
    return art;
  }
  function renderLog(keepScroll) {
    const c = cur();
    const l = logEl();
    const pinned = keepScroll ? nearBottom() : true;
    clear(l);
    if (!c.messages.length) l.append(h('p', { class: 'empty', text: t('empty') }));
    c.messages.forEach((m, i) => l.append(messageNode(c, m, i, i === c.messages.length - 1)));
    if (pinned) toBottom();
  }
  let rafPending = false;
  function scheduleStreamRender(m) {
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(() => {
      rafPending = false;
      const c = cur();
      const idx = c.messages.indexOf(m);
      const art = idx >= 0 ? logEl().querySelector('article[data-i="' + idx + '"]') : null;
      if (!art) return;
      const pinned = nearBottom();
      renderMessageContent(art.children[1], m);
      if (pinned) toBottom();
    });
  }

  /* ---------- Generation ---------- */
  function setBusy(b) {
    state.busy = b;
    $('btn-send').hidden = b;
    $('btn-stop').hidden = !b;
    $('prompt').setAttribute('aria-busy', b ? 'true' : 'false');
  }
  async function generate() {
    if (state.busy) return;
    const c = cur();
    const { body, warnings, srcIds } = buildRequest(c, state.settings, state.model);
    if (!body.messages.some((m) => m.role === 'user')) return;
    if (warnings.length) showBanner(warnings.map((w) => t(w)).join('\n'), 'warn'); else hideBanner();
    const m = { role: 'assistant', content: '', ts: Date.now(), model: state.model || '', srcIds, pending: true };
    c.messages.push(m);
    c.updated = Date.now();
    setBusy(true);
    renderLog();
    live(t('generating'));
    const ctl = new AbortController();
    state.abort = ctl;
    const st = newStream();
    const t0 = performance.now();
    let tFirst = null;
    const sse = makeSSE((d) => { if (applyData(st, d)) { if (tFirst == null) tFirst = performance.now(); m.content = st.text; scheduleStreamRender(m); } });
    let aborted = false;
    try {
      const res = await api('/v1/chat/completions', { method: 'POST', body: JSON.stringify(body), signal: ctl.signal });
      if (!res.ok) throw await httpError(res);
      if (res.body && res.body.getReader) {
        const reader = res.body.getReader();
        const dec = new TextDecoder();
        for (;;) {
          const r = await reader.read();
          if (r.done) break;
          sse.push(dec.decode(r.value, { stream: true }));
        }
        sse.push(dec.decode());
      } else {
        sse.push(await res.text());
      }
      sse.flush();
      if (st.error) throw new Error(st.error);
    } catch (e) {
      if (ctl.signal.aborted) aborted = true;
      else { m.error = e && e.message ? e.message : String(e); if (/Failed to fetch|NetworkError|Load failed/i.test(m.error)) m.error += '\n' + t('corsHint'); }
    }
    m.content = st.text;
    m.pending = false;
    if (aborted) m.stopped = true;
    m.stats = calcStats(t0, tFirst, performance.now(), st.usage, st.chunks);
    if (!m.content && !m.error && !aborted) m.content = '';
    if (!c.title) { const u = c.messages.find((x) => x.role === 'user'); if (u) c.title = titleFrom(u.content); }
    c.updated = Date.now();
    state.abort = null;
    setBusy(false);
    save();
    renderConvList();
    $('titleIn').value = c.title;
    renderLog(true);
    live(m.error ? t('err') + ': ' + m.error : t('done'));
    if (!m.error && m.content && srcIds.length) verifyMessage(c, m, true);
    refreshSlots();
  }
  function stop() { if (state.abort) state.abort.abort(); }
  function regenerate() {
    const c = cur();
    while (c.messages.length && c.messages[c.messages.length - 1].role === 'assistant') c.messages.pop();
    generate();
  }
  async function verifyMessage(c, m, quiet) {
    const srcs = (m.srcIds || []).map((id) => (c.sources || []).find((s) => s.id === id)).filter(Boolean).map((s) => s.text);
    if (!srcs.length || !m.content) return;
    state.verifying.add(m);
    renderLog(true);
    try {
      const res = await api('/v1/quotes/verify', { method: 'POST', body: JSON.stringify({ text: m.content, sources: srcs }) });
      if (!res.ok) throw await httpError(res);
      m.citations = await res.json();
      save();
    } catch (e) {
      if (!quiet) showBanner(t('verifyFail') + ' ' + (e && e.message ? e.message : ''), 'err');
    }
    state.verifying.delete(m);
    renderLog(true);
  }

  /* ---------- Conversation list ---------- */
  function renderConvList() {
    const ul = $('convlist');
    clear(ul);
    for (const c of state.convs) {
      const li = h('li', { 'data-current': c.id === state.cur ? 'true' : 'false' });
      const pick = h('button', { type: 'button', class: 'pick', text: c.title || t('untitled'), 'aria-current': c.id === state.cur ? 'true' : null, title: c.title || t('untitled') });
      pick.addEventListener('click', () => { switchTo(c.id); closeDrawers(); });
      const del = h('button', { type: 'button', text: '×', 'aria-label': t('del') + ': ' + (c.title || t('untitled')), title: t('del') });
      del.addEventListener('click', () => {
        if (!window.confirm(t('delConfirm'))) return;
        if (state.busy && c.id === state.cur) stop();
        state.convs = state.convs.filter((x) => x.id !== c.id);
        if (!state.convs.length) state.convs.push(blankConv());
        if (c.id === state.cur) state.cur = state.convs[0].id;
        save(); switchTo(state.cur);
      });
      li.append(pick, del);
      ul.append(li);
    }
  }
  function switchTo(id) {
    if (state.busy) return;
    state.cur = id;
    const c = cur();
    $('titleIn').value = c.title;
    $('sysIn').value = c.system || '';
    renderConvList(); renderLog(); renderSources();
    $('prompt').focus();
  }
  function newChat() {
    if (state.busy) return;
    const cc = cur();
    if (cc && !cc.messages.length && !cc.title) { closeDrawers(); $('prompt').focus(); return; }
    const c = blankConv();
    state.convs.unshift(c);
    state.cur = c.id;
    save(); switchTo(c.id); closeDrawers();
  }

  /* ---------- Export / import ---------- */
  function download(name, text, mime) {
    const url = URL.createObjectURL(new Blob([text], { type: mime }));
    const a = h('a', { href: url, download: name });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }
  function labels() {
    return { you: t('you'), assistant: t('assistant'), system: t('sysPrompt'), sources: t('sources'), source: t('sourceN'), untitled: t('untitled'), quoteCheck: t('quoteCheck'), allVerbatim: t('allVerbatim'), someNot: t('someNot'), noQuotes: t('noQuotes') };
  }
  function exportJSON() { download('corbul-' + slug(cur().title) + '.json', conversationsToJSON([cur()]), 'application/json'); }
  function exportAll() { download('corbul-all.json', conversationsToJSON(state.convs), 'application/json'); }
  function exportMD() { download('corbul-' + slug(cur().title) + '.md', conversationToMarkdown(cur(), labels()), 'text/markdown'); }
  async function importFile(file) {
    if (!file) return;
    if (file.size > 50 * 1024 * 1024) { showBanner(t('importBad'), 'err'); return; }
    const v = validateImport(await file.text());
    if (!v.ok) { showBanner(t('importBad'), 'err'); return; }
    state.convs.unshift(...v.convs);
    state.cur = v.convs[0].id;
    save(); switchTo(state.cur);
    showBanner(t('importOk', { n: v.convs.length }), 'warn');
  }

  /* ---------- Sources ---------- */
  function renderSources() {
    const c = cur();
    const ul = $('srclist');
    clear(ul);
    if (!c.sources.length) { ul.append(h('li', { class: 'hint', text: t('noSrc') })); return; }
    let n = 0;
    c.sources.forEach((s, i) => {
      const num = s.on !== false ? ++n : null;
      const idp = 'src-' + i;
      const lab = h('label', { class: 'inline', for: idp + '-on' });
      const cb = h('input', { type: 'checkbox', id: idp + '-on', checked: s.on !== false });
      cb.addEventListener('change', () => { s.on = cb.checked; save(); renderSources(); });
      lab.append(cb, h('span', { text: t('useSrc') + (num ? ' [S' + num + ']' : '') }));
      const title = h('input', { type: 'text', id: idp + '-t', 'aria-label': t('srcTitle'), placeholder: t('srcTitle'), value: s.title || '', maxlength: 200 });
      title.addEventListener('input', () => { s.title = title.value; save(); });
      const text = h('textarea', { id: idp + '-x', 'aria-label': t('srcText'), placeholder: t('srcText'), rows: 4, value: s.text || '' });
      text.addEventListener('input', () => { s.text = text.value; save(); });
      const rm = h('button', { type: 'button', text: t('del'), 'aria-label': t('del') + ': ' + (s.title || t('sourceN') + ' ' + (i + 1)) });
      rm.addEventListener('click', () => { c.sources.splice(i, 1); save(); renderSources(); });
      ul.append(h('li', { class: 'srcitem' }, h('div', { class: 'row' }, lab, rm), title, text));
    });
  }
  function addSource(title, text) {
    const c = cur();
    if (c.sources.length >= 64) return;
    c.sources.push({ id: newId(), title: title || '', text: text || '', on: true });
    save(); renderSources();
  }
  async function addSourceFiles(files) {
    for (const f of Array.from(files || [])) {
      if (f.size > 2 * 1024 * 1024) continue;
      addSource(f.name, await f.text());
    }
  }

  /* ---------- Server panels ---------- */
  function setStatus(on) {
    state.online = on;
    $('statusDot').className = 'dot ' + (on ? 'on' : 'off');
    $('statusLabel').textContent = on ? t('online') : t('offline');
    $('corsHint').hidden = on;
  }
  async function connect() {
    state.base = $('baseUrl').value.trim();
    state.token = $('tokenIn').value;
    LS.set(KEY_SERVER, JSON.stringify({ base: state.base }));
    try {
      const res = await api('/health');
      setStatus(res.ok);
    } catch (e) { setStatus(false); }
    await refreshModels();
    if (state.online) { await Promise.all([refreshInfo(), refreshCaps(), refreshMetrics()]); }
  }
  async function refreshModels() {
    try {
      const j = await getJSON('/v1/models');
      state.models = Array.isArray(j.data) ? j.data.filter((x) => x && typeof x.id === 'string') : [];
      if (!state.models.some((x) => x.id === state.model)) state.model = (state.models.find((x) => x.loaded) || state.models[0] || {}).id || '';
      if (!state.online) setStatus(true);
    } catch (e) { state.models = []; }
    renderModels();
  }
  function renderModels() {
    const ul = $('mlist');
    clear(ul);
    const badge = $('modelBadge');
    badge.hidden = !state.model;
    badge.textContent = state.model;
    if (!state.models.length) { ul.append(h('li', { class: 'hint', text: t('noModels') })); return; }
    state.models.forEach((mo, i) => {
      const rid = 'model-' + i;
      const radio = h('input', { type: 'radio', name: 'model', id: rid, checked: mo.id === state.model });
      radio.addEventListener('change', () => { state.model = mo.id; badge.hidden = false; badge.textContent = mo.id; refreshInfo(); });
      const lab = h('label', { class: 'inline', for: rid }, h('span', { text: mo.id }), h('span', { class: 'pill' + (mo.loaded ? ' on' : ''), text: mo.loaded ? t('loadedL') : t('idleL') }));
      const act = h('button', { type: 'button', text: mo.loaded ? t('unload') : t('load') });
      act.addEventListener('click', async () => {
        act.disabled = true;
        try {
          const res = await api(mo.loaded ? '/models/unload' : '/models/load', { method: 'POST', body: JSON.stringify({ model: mo.id }) });
          if (!res.ok) throw await httpError(res);
        } catch (e) { showBanner(t('err') + ': ' + (e && e.message ? e.message : e), 'err'); }
        await refreshModels(); refreshInfo();
      });
      ul.append(h('li', {}, h('div', { class: 'row' }, radio, lab, act), h('span', { class: 'sr', text: t('useModel') })));
    });
  }
  function kvList(obj, depth) {
    const dl = h('dl', { class: 'kv' });
    for (const k of Object.keys(obj).slice(0, 60)) {
      const v = obj[k];
      dl.append(h('dt', { text: k }));
      const dd = h('dd');
      if (v && typeof v === 'object' && depth < 3) dd.append(Array.isArray(v) ? h('span', { text: JSON.stringify(v).slice(0, 400) }) : kvList(v, depth + 1));
      else dd.textContent = typeof v === 'string' ? v : JSON.stringify(v);
      dl.append(dd);
    }
    return dl;
  }
  async function refreshInfo() {
    const box = $('infoBox');
    clear(box);
    try {
      const p = await getJSON('/props' + (state.model ? '?model=' + encodeURIComponent(state.model) : ''));
      const d = p.default_generation_settings && p.default_generation_settings.params;
      if (d && !state.hadSettings) {
        if (Number.isFinite(d.temperature)) state.settings.temperature = d.temperature;
        if (Number.isFinite(d.top_p)) state.settings.top_p = d.top_p;
        if (Number.isFinite(d.top_k)) state.settings.top_k = d.top_k;
        if (Number.isFinite(d.n_predict)) state.settings.max_tokens = d.n_predict;
        state.hadSettings = true; saveSettings(); bindSettings();
      }
      const view = {};
      for (const k of ['model', 'n_ctx', 'n_vocab', 'chat_template', 'build_info', 'total_slots', 'modalities', 'tools']) if (k in p) view[k] = p[k];
      box.append(kvList(view, 0));
    } catch (e) { box.append(h('p', { class: 'hint', text: t('nothing') })); }
    refreshSlots();
  }
  async function refreshSlots() {
    const box = $('infoBox');
    box.querySelectorAll('[data-slots]').forEach((n) => n.remove());
    try {
      const s = await getJSON('/slots');
      if (Array.isArray(s) && s.length) {
        const wrap = h('div', { 'data-slots': '1' });
        for (const x of s.slice(0, 8)) wrap.append(kvList({ model: x.model, n_ctx: x.n_ctx, n_cached: x.n_cached, is_processing: x.is_processing }, 0));
        box.append(wrap);
      }
    } catch (e) { /* optional */ }
  }
  async function refreshCaps() {
    const det = $('d-caps'), box = $('capsBox');
    clear(box);
    let shown = false;
    for (const path of ['/capabilities', '/v1/capabilities']) {
      try {
        const res = await api(path);
        if (!res.ok) continue;
        const j = await res.json();
        if (j && typeof j === 'object') { box.append(kvList(j, 0)); shown = true; break; }
      } catch (e) { /* endpoint not present */ }
    }
    det.hidden = !shown;
  }
  async function refreshMetrics() {
    const det = $('d-metrics');
    try {
      const res = await api('/metrics');
      if (!res.ok) throw new Error('x');
      const txt = await res.text();
      const lines = txt.split('\n').filter((l) => l && l[0] !== '#').slice(0, 60);
      $('metricsBox').textContent = lines.join('\n');
      det.hidden = !lines.length;
    } catch (e) { det.hidden = true; }
  }

  /* ---------- Settings binding ---------- */
  const FIELDS = [['temperature', 'number'], ['top_p', 'number'], ['top_k', 'number'], ['min_p', 'number'], ['repeat', 'number'], ['max_tokens', 'number'], ['seed', 'number'], ['structured', 'select'], ['structValue', 'text']];
  function bindSettings() {
    for (const [k] of FIELDS) { const el = $('s-' + k); el.value = state.settings[k] == null ? '' : state.settings[k]; }
    $('lockCb').checked = state.settings.lock !== false;
    syncStruct();
  }
  function syncStruct() {
    const mode = state.settings.structured;
    $('s-structValue').disabled = mode === 'off' || mode === 'json';
  }
  function initSettings() {
    for (const [k, type] of FIELDS) {
      const el = $('s-' + k);
      const upd = () => {
        state.settings[k] = type === 'number' ? (el.value === '' ? '' : parseFloat(el.value)) : el.value;
        if (type === 'number' && Number.isNaN(state.settings[k])) state.settings[k] = '';
        if (k === 'structured') syncStruct();
        saveSettings();
      };
      el.addEventListener('input', upd); el.addEventListener('change', upd);
    }
    $('lockCb').addEventListener('change', () => { state.settings.lock = $('lockCb').checked; saveSettings(); });
    bindSettings();
  }

  /* ---------- i18n / theme / drawers ---------- */
  function applyLang() {
    document.documentElement.lang = state.lang;
    document.title = 'corbul';
    document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.getAttribute('data-i18n')); });
    document.querySelectorAll('[data-i18n-ph]').forEach((el) => { el.setAttribute('placeholder', t(el.getAttribute('data-i18n-ph'))); });
    setStatus(state.online);
    renderConvList(); renderLog(true); renderSources(); renderModels();
  }
  function applyTheme() {
    if (state.theme === 'light' || state.theme === 'dark') document.documentElement.setAttribute('data-theme', state.theme);
    else document.documentElement.removeAttribute('data-theme');
    $('themeSel').value = state.theme;
  }
  function closeDrawers() {
    for (const [btn, el] of [['btn-nav', 'side'], ['btn-panels', 'aside']]) { $(el).classList.remove('open'); $(btn).setAttribute('aria-expanded', 'false'); }
  }
  function toggleDrawer(btn, el, other) {
    const open = !$(el).classList.contains('open');
    closeDrawers();
    if (open) { $(el).classList.add('open'); $(btn).setAttribute('aria-expanded', 'true'); const f = $(el).querySelector('button, input, select, textarea, summary'); if (f) f.focus(); }
  }

  /* ---------- Wiring ---------- */
  function init() {
    load();
    const ls = $('langSel');
    for (const l of LANGS) ls.append(h('option', { value: l, text: LANG_NAMES[l] }));
    ls.value = state.lang;
    ls.addEventListener('change', () => { state.lang = ls.value; LS.set(KEY_LANG, state.lang); applyLang(); });
    $('themeSel').addEventListener('change', () => { state.theme = $('themeSel').value; LS.set(KEY_THEME, state.theme); applyTheme(); });
    $('baseUrl').value = state.base;
    $('btn-connect').addEventListener('click', connect);
    $('btn-models').addEventListener('click', refreshModels);
    $('btn-new').addEventListener('click', newChat);
    $('btn-exp-json').addEventListener('click', exportJSON);
    $('btn-exp-md').addEventListener('click', exportMD);
    $('btn-imp').addEventListener('click', () => $('impfile').click());
    $('impfile').addEventListener('change', async (e) => { await importFile(e.target.files[0]); e.target.value = ''; });
    $('btn-addsrc').addEventListener('click', () => addSource('', ''));
    $('btn-srcfile').addEventListener('click', () => $('srcfile').click());
    $('srcfile').addEventListener('change', async (e) => { await addSourceFiles(e.target.files); e.target.value = ''; });
    $('bannerX').addEventListener('click', hideBanner);
    $('btn-nav').addEventListener('click', () => toggleDrawer('btn-nav', 'side'));
    $('btn-panels').addEventListener('click', () => toggleDrawer('btn-panels', 'aside'));
    $('titleIn').addEventListener('input', () => { cur().title = $('titleIn').value; save(); renderConvList(); });
    $('sysIn').addEventListener('input', () => { cur().system = $('sysIn').value; save(); });
    $('btn-stop').addEventListener('click', stop);
    $('composer').addEventListener('submit', (e) => {
      e.preventDefault();
      if (state.busy) return;
      const ta = $('prompt');
      const text = ta.value.trim();
      if (!text) return;
      const c = cur();
      c.messages.push({ role: 'user', content: text, ts: Date.now() });
      if (!c.title) { c.title = titleFrom(text); $('titleIn').value = c.title; renderConvList(); }
      ta.value = ''; autosize();
      generate();
    });
    const ta = $('prompt');
    const autosize = () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight + 2, window.innerHeight * 0.4) + 'px'; };
    ta.addEventListener('input', autosize);
    ta.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('composer').requestSubmit(); }
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { if (state.busy) stop(); closeDrawers(); }
    });
    // drop text files onto the sources list
    const dz = $('d-sources');
    dz.addEventListener('dragover', (e) => { e.preventDefault(); });
    dz.addEventListener('drop', (e) => { e.preventDefault(); addSourceFiles(e.dataTransfer && e.dataTransfer.files); });
    initSettings();
    applyTheme();
    applyLang();
    $('titleIn').value = cur().title;
    $('sysIn').value = cur().system || '';
    if (!LS.set('corbul.webui.v1.probe', '1')) { state.storageOk = false; showBanner(t('storeFail'), 'warn'); }
    connect();
  }
  init();
})();
