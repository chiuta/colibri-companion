name: build
on:
  push: { branches: [main], tags: ['v*'] }
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag: { description: "Version to publish as a draft pre-release (e.g. v0.1.0-alpha.1); leave empty for a plain build", required: false }
permissions: { contents: read }

jobs:
  licenses:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with: { node-version: latest, check-latest: true }
      - uses: EmbarkStudios/cargo-deny-action@v2
        with: { command: check licenses }

  build:
    needs: licenses
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-26.04,  target: x86_64-unknown-linux-gnu,  name: linux-x86_64 }
          - { os: ubuntu-26.04-arm, target: aarch64-unknown-linux-gnu, name: linux-aarch64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,   name: windows-x86_64 }
          - { os: macos-15-intel,       target: x86_64-apple-darwin,      name: macos-intel }
          - { os: macos-latest,   target: aarch64-apple-darwin,     name: macos-apple-silicon }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with: { node-version: latest, check-latest: true }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}", components: clippy }
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p colibri-companion --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          d=colibri-companion-${{ matrix.name }}; mkdir "$d"
          cp LICENSE NOTICE README*.md THIRD_PARTY_LICENSES.md "$d"/ && cp -r licenses "$d"/
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          cp "target/${{ matrix.target }}/release/colibri-companion$ext" "$d"/
          if [ "${{ runner.os }}" = "Linux" ]; then cp -r packaging "$d"/; fi
          if [ "${{ runner.os }}" = "Windows" ]; then 7z a "$d.zip" "$d"; else tar czf "$d.tar.gz" "$d"; fi
      - uses: actions/upload-artifact@v5
        with:
          name: colibri-companion-${{ matrix.name }}
          path: colibri-companion-${{ matrix.name }}.*

  release:
    # Only for version tags: attaches every platform's archive to a draft pre-release.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-26.04
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v5
        with: { path: dist, merge-multiple: true }
      - name: Draft pre-release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          tag="${{ inputs.release_tag || github.ref_name }}"
          gh release create "$tag" dist/* --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --draft --prerelease --title "Colibri Companion $tag" \
            --notes "First public alpha. Friendly desktop interface for colibri in 8 languages: guided setup, chat with Markdown and reasoning, conversation search / rename / export, text-file drop. Windows and macOS builds come from CI and are not yet tested by hand. Apache-2.0. Does not bundle colibri."
