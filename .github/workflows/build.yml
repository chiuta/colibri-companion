name: build
on:
  push: { branches: [main], tags: ['v*'] }
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag: { description: "Version to publish as a draft pre-release (e.g. v0.1.0-alpha.1); leave empty for a plain build", required: false }
permissions: { contents: read }
# A newer push to a pull request replaces a build of it that is still running. Pushes to main, tags
# and manual runs each have a group of their own, so none is ever cancelled or left waiting: every
# commit keeps a result that can be read by its SHA.
concurrency:
  group: build-${{ github.event_name == 'pull_request' && github.ref || format('{0}-{1}', github.sha, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  licenses:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: latest, check-latest: true }
      - uses: EmbarkStudios/cargo-deny-action@v2
        with: { command: check licenses bans sources }

  advisories:
    # Informational: a new advisory shows up here without stopping a release.
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: EmbarkStudios/cargo-deny-action@v2
        with: { command: check advisories }

  build:
    needs: licenses
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-26.04,  target: x86_64-unknown-linux-gnu,  name: linux-x86_64 }
          - { os: ubuntu-26.04-arm, target: aarch64-unknown-linux-gnu, name: linux-aarch64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,   name: windows-x86_64 }
          - { os: macos-15-intel,       target: x86_64-apple-darwin,      name: macos-intel }
          - { os: macos-latest,   target: aarch64-apple-darwin,     name: macos-apple-silicon }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: latest, check-latest: true }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}", components: clippy }
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev
      - name: Format and lint (once)
        if: matrix.name == 'linux-x86_64'
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p colibri-companion --target ${{ matrix.target }}
      - name: Binary size (informational)
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.name }}
        run: |
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          f="target/$TARGET/release/colibri-companion$ext"
          bytes=$(wc -c < "$f" | tr -d ' ')
          echo "Release binary, $PLATFORM: $bytes bytes ($((bytes / 1048576)).$(( (bytes % 1048576) * 10 / 1048576 )) MiB)" >> "$GITHUB_STEP_SUMMARY"
      - name: Package
        shell: bash
        run: |
          d=colibri-companion-${{ matrix.name }}; mkdir "$d"
          cp LICENSE NOTICE README*.md THIRD_PARTY_LICENSES.md "$d"/ && cp -r licenses "$d"/
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          cp "target/${{ matrix.target }}/release/colibri-companion$ext" "$d"/
          if [ "${{ runner.os }}" = "Linux" ]; then cp -r packaging "$d"/; fi
          if [ "${{ runner.os }}" = "Windows" ]; then 7z a "$d.zip" "$d"; else tar czf "$d.tar.gz" "$d"; fi
      - uses: actions/upload-artifact@v5
        with:
          name: colibri-companion-${{ matrix.name }}
          path: colibri-companion-${{ matrix.name }}.*
          retention-days: 14
          if-no-files-found: error

  build-old-linux:
    # The same program built to run on older Linux distributions: it is linked against glibc 2.17
    # (the baseline of Debian 8+, Ubuntu 14.04+, RHEL/CentOS 7+, and every newer one) with
    # cargo-zigbuild. The build still runs on Ubuntu 26.04; only the library baseline is older.
    # The windowing and graphics libraries are loaded at run time, so they come from the user's system.
    needs: licenses
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-26.04,     rust: x86_64-unknown-linux-gnu,  name: linux-x86_64-glibc2.17 }
          - { os: ubuntu-26.04-arm, rust: aarch64-unknown-linux-gnu, name: linux-aarch64-glibc2.17 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.rust }}" }
      - uses: Swatinem/rust-cache@v2
        with: { key: "glibc217-${{ matrix.rust }}" }
      - name: Linux system libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev
      - name: Zig and cargo-zigbuild
        run: python3 -m pip install --user --break-system-packages ziglang cargo-zigbuild && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build against glibc 2.17
        env:
          RUST_TARGET: ${{ matrix.rust }}
        run: cargo zigbuild --release --locked -p colibri-companion --target "$RUST_TARGET.2.17"
      - name: Check the glibc baseline
        env:
          RUST_TARGET: ${{ matrix.rust }}
        run: |
          f="target/$RUST_TARGET/release/colibri-companion"
          # the newest glibc symbol the program asks for must be 2.17 or older
          newest=$(objdump -T "$f" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)
          echo "Newest glibc symbol required: $newest" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$(printf '%s\n2.17\n' "$newest" | sort -V | tail -1)" = "2.17" ] || { echo "needs glibc $newest" >&2; exit 1; }
      - name: Load it in an old distribution
        env:
          RUST_TARGET: ${{ matrix.rust }}
        run: |
          # Ubuntu 16.04 has glibc 2.23: a missing symbol version shows up as "version `GLIBC_..' not found".
          out=$(docker run --rm -v "$PWD/target/$RUST_TARGET/release:/app:ro" ubuntu:16.04 ldd /app/colibri-companion 2>&1 || true)
          echo "$out"
          if echo "$out" | grep -q "not found" && echo "$out" | grep -q "GLIBC"; then echo "glibc mismatch" >&2; exit 1; fi
      - name: Package
        run: |
          d=colibri-companion-${{ matrix.name }}; mkdir "$d"
          cp LICENSE NOTICE README*.md THIRD_PARTY_LICENSES.md "$d"/ && cp -r licenses "$d"/
          cp "target/${{ matrix.rust }}/release/colibri-companion" "$d"/
          cp -r packaging "$d"/
          tar czf "$d.tar.gz" "$d"
      - uses: actions/upload-artifact@v5
        with:
          name: colibri-companion-${{ matrix.name }}
          path: colibri-companion-${{ matrix.name }}.*
          retention-days: 14
          if-no-files-found: error

  release:
    # Only for version tags: attaches every platform's archive to a draft pre-release.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: [build, build-old-linux]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions: { contents: write }
    steps:
      # only Cargo.toml is needed, to check that the tag names the version inside the program
      - uses: actions/checkout@v5
        with: { sparse-checkout: Cargo.toml, sparse-checkout-cone-mode: false }
      - uses: actions/download-artifact@v5
        with: { path: dist, merge-multiple: true }
      - name: Draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # values arrive through the environment, never pasted into the script text
          case "$TAG" in v[0-9]*) ;; *) echo "not a version tag: $TAG" >&2; exit 1 ;; esac
          # the program reports the version in Cargo.toml: it must be the one being released
          want=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$want" = "$TAG" ] || { echo "Cargo.toml says $want but the tag is $TAG" >&2; exit 1; }
          gh release create "$TAG" dist/* --repo "$REPO" --target "$SHA" \
            --draft --prerelease --title "Colibri Companion $TAG" \
            --notes "Early alpha of the friendly desktop interface for colibri, in 8 languages. See the README and docs/ for what works today and what is still only a library. Windows and macOS builds come from CI and are not yet tested by hand. Apache-2.0. Does not bundle colibri."
